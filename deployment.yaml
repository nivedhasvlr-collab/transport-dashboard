apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-dashboard
  labels:
    app: transport-dashboard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: transport-dashboard
  template:
    metadata:
      labels:
        app: transport-dashboard
    spec:
      containers:
      - name: dashboard
        image: nivedhasvlr@gmail.com/transport-dashboard:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: transport-dashboard-service
spec:
  type: NodePort
  selector:
    app: transport-dashboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

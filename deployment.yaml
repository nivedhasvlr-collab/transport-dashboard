apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-dashboard
  labels:
    app: transport-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transport-dashboard
  template:
    metadata:
      labels:
        app: transport-dashboard
    spec:
      containers:
      - name: dashboard-app
        image: nivedhasvlr/transport-dashboard:latest

        ports:
        - containerPort: 80
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: transport-dashboard-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: transport-dashboard
